<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Robotyczna Temida z wagą">
<defs>
<filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pan{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
@keyframes panr{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
@keyframes visor{0%,100%{opacity:.55}50%{opacity:1}}
.beam{transform-origin:210px 78px;animation:sway 6s ease-in-out infinite}
.panL{animation:pan 6s ease-in-out infinite}.panR{animation:panr 6s ease-in-out infinite}
.visor{animation:visor 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g fill="none" stroke="#34d399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".8">
  <!-- toga -->
  <path d="M244 300 L256 150 C262 122 280 110 300 108 C320 110 338 122 344 150 L356 300"/>
  <path d="M278 300 C272 240 274 190 290 124 M322 300 C328 240 326 190 310 124" stroke-opacity=".35"/>
  <!-- głowa -->
  <path d="M276 92 C276 52 324 52 324 92 C324 106 276 106 276 92 Z"/>
  <path d="M292 96 V108 M308 96 V108" stroke-opacity=".5"/>
  <!-- ramiona z przegubami -->
  <path d="M258 150 L214 112 L210 78"/>
  <path d="M342 150 L364 210 L360 262"/>
  <path d="M360 262 V296 M350 260 H370" stroke-opacity=".6"/>
</g>
<g fill="#050807" stroke="#a7f3d0" stroke-width="1.2"><circle cx="214" cy="112" r="4"/><circle cx="258" cy="150" r="4"/><circle cx="364" cy="210" r="4"/><circle cx="342" cy="150" r="4"/></g>
<!-- przepaska-wizjer i rdzeń -->
<rect class="visor" x="276" y="72" width="48" height="7" rx="2" fill="#6ee7b7" filter="url(#g)"/>
<circle cx="300" cy="162" r="4" fill="#ecfdf5" filter="url(#g)"/>
<!-- waga zawieszona na dłoni (210,78) -->
<g class="beam" filter="url(#g)">
  <path d="M166 78 H254" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="210" cy="78" r="3.5" fill="#ecfdf5"/>
  <g class="panL" fill="none" stroke="#a7f3d0" stroke-width="1.1"><path d="M170 80 V122 M170 80 L152 122 M170 80 L188 122"/><path d="M146 122 Q170 140 194 122" stroke="#6ee7b7" stroke-width="1.4"/></g>
  <g class="panR" fill="none" stroke="#a7f3d0" stroke-width="1.1"><path d="M250 80 V122 M250 80 L232 122 M250 80 L268 122"/><path d="M226 122 Q250 140 274 122" stroke="#6ee7b7" stroke-width="1.4"/></g>
</g>
</svg>
