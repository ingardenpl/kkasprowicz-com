<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d"><title id="t">AIQ. Edukacja w erze sztucznej inteligencji</title><desc id="d">Animowany baner projektu AIQ: gmach uczelni nocą, nad nim świetlista sieć neuronów w kształcie mózgu i wznoszące się cząstki danych.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020806"/><stop offset=".55" stop-color="#03211a"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6ee7b7" stop-opacity=".55"/><stop offset=".5" stop-color="#10b981" stop-opacity=".18"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
<linearGradient id="win" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#10b981"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
<style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.35}96%{opacity:.9}}
.n{fill:#a7f3d0;animation:pulse 3.2s ease-in-out infinite}
.n:nth-child(2n){animation-delay:-1.1s}.n:nth-child(3n){animation-delay:-2.2s}
.syn{fill:none;stroke:#34d399;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:6 18;animation:flow 6s linear infinite;opacity:.8}
.p{fill:#6ee7b7;opacity:0;animation:rise 7s linear infinite}
.brain{animation:breathe 5s ease-in-out infinite}
.wl{fill:url(#win);opacity:.9;animation:flick 9s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{display:none}}
</style>
</defs>
<rect width="1200" height="300" fill="url(#sky)"/>
<!-- gwiazdy -->
<g fill="#d1fae5" opacity=".7"><circle cx="60" cy="40" r="1"/><circle cx="140" cy="90" r="1.3"/><circle cx="260" cy="30" r="1"/><circle cx="330" cy="120" r=".9"/><circle cx="880" cy="26" r="1.2"/><circle cx="990" cy="70" r="1"/><circle cx="1080" cy="40" r="1.4"/><circle cx="1150" cy="110" r="1"/><circle cx="700" cy="20" r="1"/></g>
<!-- poświata nad gmachem -->
<ellipse cx="600" cy="150" rx="330" ry="150" fill="url(#halo)"/>
<!-- gmach uczelni (kolumnada) -->
<g transform="translate(390,170)">
  <path d="M0 130 L0 60 L210 20 L420 60 L420 130 Z" fill="#06231b" stroke="#10b981" stroke-opacity=".5"/>
  <path d="M10 60 L210 24 L410 60" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <rect x="0" y="60" width="420" height="10" fill="#083d2e"/>
  <g fill="#052a20" stroke="#34d399" stroke-opacity=".6" stroke-width="1">
    <rect x="30" y="72" width="16" height="58"/><rect x="92" y="72" width="16" height="58"/><rect x="154" y="72" width="16" height="58"/><rect x="250" y="72" width="16" height="58"/><rect x="312" y="72" width="16" height="58"/><rect x="374" y="72" width="16" height="58"/>
  </g>
  <g class="wl"><rect x="56" y="84" width="24" height="18" rx="2"/><rect x="118" y="84" width="24" height="18" rx="2"/><rect x="180" y="84" width="60" height="30" rx="3"/><rect x="278" y="84" width="24" height="18" rx="2"/><rect x="340" y="84" width="24" height="18" rx="2"/></g>
  <rect x="-30" y="128" width="480" height="6" fill="#0a4a38"/>
</g>
<!-- odbicie na placu -->
<rect x="0" y="300" width="1200" height="0"/>
<rect x="0" y="302" width="1200" height="0" />
<!-- mózg z sieci neuronów -->
<g class="brain" filter="url(#glow)" transform="translate(600,98)">
  <path d="M-120 10 C-130 -40 -80 -70 -40 -58 C-20 -80 30 -80 50 -58 C100 -70 140 -30 120 10 C140 40 100 70 60 60 C30 80 -30 80 -60 60 C-100 70 -135 40 -120 10 Z" fill="none" stroke="#34d399" stroke-width="1.4" stroke-opacity=".7"/>
  <g class="syn"><path d="M-100 0 L-50 -40 L0 -20 L40 -50 L95 -5 L60 40 L10 25 L-40 50 L-100 0"/><path d="M-50 -40 L-40 50 M0 -20 L60 40 M40 -50 L10 25 M-100 0 L0 -20 L95 -5"/></g>
  <g><circle class="n" cx="-100" cy="0" r="4"/><circle class="n" cx="-50" cy="-40" r="4.5"/><circle class="n" cx="0" cy="-20" r="5"/><circle class="n" cx="40" cy="-50" r="4"/><circle class="n" cx="95" cy="-5" r="4.5"/><circle class="n" cx="60" cy="40" r="4"/><circle class="n" cx="10" cy="25" r="5"/><circle class="n" cx="-40" cy="50" r="4"/><circle class="n" cx="0" cy="5" r="7" fill="#fff"/></g>
</g>
<!-- cząstki danych -->
<g filter="url(#soft)">
  <circle class="p" cx="470" cy="250" r="2.2" style="animation-delay:-1s"/><circle class="p" cx="520" cy="262" r="1.8" style="animation-delay:-3s"/><circle class="p" cx="585" cy="255" r="2.4" style="animation-delay:-5s"/><circle class="p" cx="640" cy="266" r="1.6" style="animation-delay:-2s"/><circle class="p" cx="700" cy="250" r="2" style="animation-delay:-6s"/><circle class="p" cx="745" cy="262" r="2.3" style="animation-delay:-4s"/><circle class="p" cx="560" cy="270" r="1.5" style="animation-delay:-0.5s"/><circle class="p" cx="670" cy="272" r="1.7" style="animation-delay:-3.6s"/>
</g>
<!-- tytuł -->
<g font-family="Georgia,'Times New Roman',serif" fill="#ecfdf5">
  <text x="60" y="150" font-size="88" font-weight="700" letter-spacing="2" filter="url(#glow)">AIQ</text>
  <text x="62" y="186" font-size="20" font-family="Consolas,'Courier New',monospace" fill="#6ee7b7" letter-spacing="2">EDUKACJA W ERZE</text>
  <text x="62" y="212" font-size="20" font-family="Consolas,'Courier New',monospace" fill="#6ee7b7" letter-spacing="2">SZTUCZNEJ INTELIGENCJI</text>
</g>
<g font-family="Consolas,'Courier New',monospace" font-size="14" fill="#a7f3d0" opacity=".8" text-anchor="end"><text x="1140" y="262">UMCS · LUBLIN · 2026</text></g>
<!-- winieta -->
<rect width="1200" height="300" fill="none" stroke="#10b981" stroke-opacity=".35"/>
</svg>
