<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="AIQ: sieć neuronów nad gmachem uczelni">
<defs>
<filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-120px);opacity:0}}
.n{fill:#a7f3d0;animation:pulse 3.4s ease-in-out infinite}
.n:nth-child(2n){animation-delay:-1.2s}.n:nth-child(3n){animation-delay:-2.3s}
.syn{stroke-dasharray:5 15;animation:flow 7s linear infinite}
.p{fill:#6ee7b7;opacity:0;animation:rise 7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{display:none}}
</style>
</defs>
<g fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".75">
  <!-- gmach: fronton i kolumny -->
  <path d="M150 292 V232 L300 196 L450 232 V292"/>
  <path d="M150 232 H450"/>
  <path d="M178 244 V292 M226 244 V292 M274 244 V292 M326 244 V292 M374 244 V292 M422 244 V292"/>
  <path d="M120 292 H480"/>
  <!-- mózg: obrys i synapsy -->
  <path d="M212 118 C200 76 244 50 282 64 C300 42 346 42 364 64 C404 52 440 84 424 118 C440 146 406 172 374 162 C350 180 302 180 280 162 C246 172 198 150 212 118 Z" stroke-opacity=".5"/>
  <g class="syn"><path d="M232 118 L276 84 L318 100 L352 72 L398 110 L370 146 L326 132 L286 152 L232 118"/><path d="M276 84 L286 152 M318 100 L370 146 M352 72 L326 132 M232 118 L318 100 L398 110"/></g>
</g>
<g filter="url(#g)">
  <circle class="n" cx="232" cy="118" r="3.5"/><circle class="n" cx="276" cy="84" r="4"/><circle class="n" cx="318" cy="100" r="4.5"/><circle class="n" cx="352" cy="72" r="3.5"/><circle class="n" cx="398" cy="110" r="4"/><circle class="n" cx="370" cy="146" r="3.5"/><circle class="n" cx="326" cy="132" r="4.5"/><circle class="n" cx="286" cy="152" r="3.5"/><circle cx="318" cy="112" r="5.5" fill="#fff"/>
</g>
<g><circle class="p" cx="250" cy="286" r="1.8" style="animation-delay:-1s"/><circle class="p" cx="300" cy="288" r="2" style="animation-delay:-3.5s"/><circle class="p" cx="350" cy="286" r="1.6" style="animation-delay:-5.5s"/><circle class="p" cx="400" cy="289" r="1.8" style="animation-delay:-2.2s"/></g>
</svg>
