<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Hologram Zamku Lubelskiego wyłaniający się ze smartfona">
<defs>
<linearGradient id="cone" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="above"><rect x="0" y="0" width="600" height="206"/></clipPath>
<style>
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(176px)}}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.castle{animation:hover 6s ease-in-out infinite}
.scan{animation:scan 4.5s linear infinite}
.led{animation:blink 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.scan{display:none}}
</style>
</defs>
<!-- stożek światła -->
<path d="M262 206 L338 206 L430 30 L170 30 Z" fill="url(#cone)"/>
<g clip-path="url(#above)">
  <g class="castle" filter="url(#g)" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-opacity=".85">
    <!-- mur z blankami i brama -->
    <path d="M190 206 V150 H410 V206"/>
    <path d="M190 150 V140 H204 V150 M218 150 V140 H232 V150 M246 150 V140 H260 V150 M340 150 V140 H354 V150 M368 150 V140 H382 V150 M396 150 V140 H410 V150"/>
    <path d="M290 206 V176 A10 10 0 0 1 310 176 V206"/>
    <!-- donżon -->
    <path d="M216 150 V62 M268 150 V62"/>
    <path d="M210 62 H274 M210 62 V50 H222 V62 M234 62 V50 H246 V62 M258 62 V50 H270 V62"/>
    <rect x="236" y="86" width="12" height="18" rx="6"/><rect x="236" y="118" width="12" height="18" rx="6"/>
    <!-- kaplica -->
    <path d="M322 150 V100 H394 V150"/>
    <path d="M314 100 L358 58 L402 100"/>
    <path d="M358 58 V44 M352 50 H364"/>
    <path d="M336 150 V124 H350 V150 M366 150 V124 H380 V150"/>
  </g>
  <g class="scan"><rect x="170" y="26" width="260" height="1.5" fill="#a7f3d0" opacity=".7" filter="url(#g)"/></g>
</g>
<!-- smartfon w dłoniach -->
<g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linejoin="round">
  <rect x="236" y="206" width="128" height="88" rx="16"/>
  <rect x="246" y="214" width="108" height="66" rx="9" stroke-opacity=".5"/>
  <path d="M222 254 C210 262 208 288 222 296 H236 V254 Z M378 254 C390 262 392 288 378 296 H364 V254 Z" stroke-opacity=".6"/>
</g>
<circle class="led" cx="300" cy="287" r="2" fill="#6ee7b7"/>
</svg>
